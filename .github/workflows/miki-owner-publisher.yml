name: Miki Clean Owner Publisher

on:
  pull_request:
    paths:
      - 'miki-publisher.json'
      - 'README.md'
      - 'scripts/**'
      - '.github/workflows/miki-owner-publisher.yml'
  push:
    branches:
      - main
    paths:
      - 'miki-publisher.json'
      - 'README.md'
      - 'scripts/**'
      - '.github/workflows/miki-owner-publisher.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: miki-clean-owner-publisher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Clean Publisher
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Clean Publisher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Anki21b decompression support
        run: python -m pip install --disable-pip-version-check --no-input zstandard==0.23.0
      - name: Compile publisher
        run: |
          python -m py_compile scripts/publish_miki_owner_pack.py
          python -m py_compile scripts/miki_owner_publisher.py
          python -m py_compile scripts/compile_miki_owner_t1.py
          python -m py_compile scripts/audit_apkg_identity.py
          python -m py_compile scripts/sync_owner_inbox.py
          python -m py_compile scripts/sync_owner_inbox_safe.py
          python -m py_compile scripts/publish_latest_pointer.py
      - name: Run publisher unit tests
        run: >-
          PYTHONPATH=scripts python -m unittest
          scripts/test_miki_owner_publisher.py
          scripts/test_miki_owner_t1.py
          scripts/test_sync_owner_inbox.py
          scripts/test_sync_owner_inbox_safe.py
          scripts/test_publish_latest_pointer.py
      - name: Stage Owner Inbox candidates in validation workspace
        id: inbox
        run: python scripts/sync_owner_inbox_safe.py --source-dir "$RUNNER_TEMP/miki-owner-inbox" --json
      - name: Build manifests and security reports without publishing
        run: |
          export MIKI_RELEASE_DATE="$(date -u +%Y%m%d)"
          python scripts/miki_owner_publisher.py build
          python scripts/compile_miki_owner_t1.py
      - name: Validate generated trust boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('miki-publisher.json').read_text(encoding='utf-8'))
          state = json.loads(Path('.miki-publish-state.json').read_text(encoding='utf-8'))
          assert config.get('repository') == 'mirrorlious/miki-clean-publisher'
          assert isinstance(state.get('packs'), list) and state['packs'], 'validation must produce at least one clean pack family'
          deny_artifact_tokens = ('dyl',)
          clean_zh_path = 'zh2000v2.apkg'
          configured_sources = set()
          for pack in config.get('packs', []):
              for release in pack.get('releases', []):
                  assert release['status'] in ('ACTIVE', 'ARCHIVED', 'WITHDRAWN', 'REVOKED')
                  for variant in release.get('variants', []):
                      source = str(variant.get('sourcePath', '')).replace('\\', '/')
                      configured_sources.add(source)
                      assert source.startswith('artifacts/'), f'non-clean artifact source: {source}'
                      assert not any(token in source.lower() for token in deny_artifact_tokens), f'denied artifact escaped policy: {source}'
                      origin = variant.get('origin') or {}
                      assert origin.get('repository') == 'mirrorlious/ankicardsfo1po'
                      assert origin.get('provenance') == 'OWNER_UPLOAD_ASSERTION'
                      origin_path = str(origin.get('path') or '').replace('\\', '/')
                      if 'zh2000' in origin_path.casefold():
                          assert origin_path == clean_zh_path, f'unapproved ZH2000 source escaped policy: {origin_path}'

          safe_total = 0
          for family in state['packs']:
              for release in family['releases']:
                  for variant in release['variants']:
                      assert variant['sourcePath'] in configured_sources
                      manifest = json.loads(Path(variant['manifestPath']).read_text(encoding='utf-8'))
                      report = json.loads(Path(variant['templateReportPath']).read_text(encoding='utf-8'))
                      assert manifest['schemaVersion'] == 2
                      assert manifest['payload']['format'] == 'apkg'
                      digest = manifest['resources'][0]['integrity']['digest']
                      assert len(digest) == 64
                      assert report['sourceSha256'] == digest
                      assert report['templateEditPolicy'] == 'fields-only'
                      assert report['summary']['executionApprovedCount'] == 0
                      assert report['rawJavascriptExecutionApproved'] is False
                      assert report.get('contentFingerprint', '').startswith('sha256:')
                      assert report.get('templateFingerprint', '').startswith('sha256:')
                      safe_total += int(report['summary'].get('safeInteractionApprovedCount', 0))
          print(f"validated {len(state['packs'])} clean family(s); safe-interaction-approved={safe_total}")
          PY
      - name: Ensure legacy ZH2000 and DYL were not copied
        run: |
          if find artifacts -type f \( -iname '*ZH2000_apkg*' -o -iname '*dyl*' \) -print -quit | grep -q .; then
            echo 'Denied legacy asset copied into clean artifacts.' >&2
            exit 1
          fi

  publish:
    name: Publish immutable feed and latest pointer
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.actor != 'github-actions[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Clean Publisher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Anki21b decompression support
        run: python -m pip install --disable-pip-version-check --no-input zstandard==0.23.0
      - name: Configure publisher identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Sync Owner Inbox
        id: inbox
        run: python scripts/sync_owner_inbox_safe.py --source-dir "$RUNNER_TEMP/miki-owner-inbox" --json
      - name: Decide whether immutable feed must advance
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          artifact_changed=false
          if [ -d artifacts ] && [ -n "$(git status --porcelain -- artifacts/)" ]; then
            artifact_changed=true
          fi
          publish_needed=false
          if [ "$artifact_changed" = true ] || [ "$EVENT_NAME" != schedule ]; then
            publish_needed=true
          fi
          echo "artifact_changed=$artifact_changed" >> "$GITHUB_OUTPUT"
          echo "publish_needed=$publish_needed" >> "$GITHUB_OUTPUT"
      - name: Commit inbox cursor, registry and accepted artifacts
        run: |
          git add -- miki-publisher.json
          if [ -d artifacts ]; then git add -- artifacts/; fi
          if git diff --cached --quiet; then
            echo "Owner Inbox already synchronized."
          else
            git commit -m "chore(publisher): sync Owner Inbox"
          fi
      - name: Build APKG manifests and template security reports
        if: steps.decision.outputs.publish_needed == 'true'
        run: |
          export MIKI_RELEASE_DATE="$(date -u +%Y%m%d)"
          python scripts/miki_owner_publisher.py build
          python scripts/compile_miki_owner_t1.py
      - name: Commit immutable manifest snapshot
        if: steps.decision.outputs.publish_needed == 'true'
        id: manifest_commit
        run: |
          git add -- '.miki-'*.manifest.v2.json '.miki-reports/' '.miki-publish-state.json'
          if git diff --cached --quiet; then
            echo "No manifest changes detected."
          else
            git commit -m "build(publisher): refresh immutable manifests"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build owner feed against immutable manifest commit
        if: steps.decision.outputs.publish_needed == 'true'
        run: python scripts/miki_owner_publisher.py feed --commit '${{ steps.manifest_commit.outputs.sha }}'
      - name: Commit immutable feed snapshot
        if: steps.decision.outputs.publish_needed == 'true'
        id: feed_commit
        run: |
          git add -- miki-public/index.json
          if git diff --cached --quiet; then
            echo "Feed content unchanged."
          else
            git commit -m "build(publisher): update immutable owner feed"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish digest-bound latest pointer
        if: steps.decision.outputs.publish_needed == 'true'
        run: |
          python scripts/publish_latest_pointer.py --feed-commit '${{ steps.feed_commit.outputs.sha }}'
          git add -- miki-public/latest.json
          if git diff --cached --quiet; then
            echo "Latest pointer unchanged."
          else
            git commit -m "build(publisher): advance latest feed pointer"
          fi
      - name: Push Clean Publisher commits
        run: |
          if [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ]; then
            echo "No publisher changes to push."
          else
            git push origin HEAD:main
          fi
